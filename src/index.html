<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Hackahub — Encontre e participe de hackathons</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Hackahub é a plataforma para descobrir, participar e mentorar hackathons. Encontre eventos, monte seu time e escolha desafios.">
  <meta name="theme-color" content="#05050c">
  <meta name="color-scheme" content="dark">

  <!-- Open Graph (docs §7 — SEO público) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hackahub">
  <meta property="og:title" content="Hackahub — Encontre e participe de hackathons">
  <meta property="og:description" content="Descubra e participe de hackathons. Monte seu time e escolha desafios.">

  <!-- Ícones da marca (pasta public/ é servida na raiz). -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- Tipografia da marca (docs §1.2): Poppins para títulos, Inter para corpo.
       Fallbacks de sistema garantem render mesmo offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet">
</head>
